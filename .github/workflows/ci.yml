name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install F*
        run: |
          curl -fsSL https://aka.ms/install-fstar | bash -s -- --nightly
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Verify
        run: make -skj$(nproc)
